<!DOCTYPE html>
<html>
<head>
    <title>CODERS VERSE
    </title>
    <link rel="icon" type="image/png" href="Pictures/Logo.png">
        <style>
            .container {
                width: 80%;
                max-width: 1000px;
                margin: 0 auto;
            }
            #command {
                width: 100%;
                box-sizing: border-box;
                background-color: #111;
                color: #00ff66;
                border: 1px solid #00ff66;
                font-family: monospace;
            }
            #terminal {
                background-color: black;
                color: #0f6;
                width: 30%;
                border-radius: 5px;
                height:200px;
                padding: 10px;
                font-family: monospace;
                font-size: 12px;
                border: 3px solid #0f6;

                position: absolute;
                top: 10px;
                right: 10px;

            }
            #output {
                min-height: 100px;
                margin-bottom: 10px;
            }
            body { 
                min-height:100vh;
                background: linear-gradient(to bottom, black, rgba(169, 169, 169, 0.425));
                background-attachment:fixed;
                border: 3px solid black;
                font-size: 13px;
				color: white;
                font-family: monospace;
                margin: 0;
            }
            h1 {
                font-family: monospace;
                font-size: 35px;
            }
            h2 {
				font-family: monospace;
                font-size: 22px;
            }
            h3 {
				font-family: monospace;
                font-size: 18px;
            }
            p {
                font-size: 13px;
                font-family: monospace;
            }
        </style>
</head>
    <body>
        <div class="container">
            <h1><b>This is the start of the Coders verse.</b></h1>
        
            <h2>The purpose</h2>

            <p>
                Our goal is to Make a place where poeple can; learn,<br> code, talk and feel glad
                about who we are without the threats and disrespect<br> we gain from groups of 
                people who overlook our use.
            </p>
                <br>

            <div id="terminal">
                <div id="output"></div> 
                <input type="text" id="command" placeholder="Type command">
            </div>
        </div>
    </body>
</html>
<script>
    const command = document.getElementById("command");
    const output = document.getElementById("output");

    const commands = {
        hello: "How goes you?",
        about: "We have fun help eachother learn.",
        games: "Sorry we dont have any games yet but we will soon.😢",
        join: "Join our group by sending me a message on discord. My username is: sainwolf2703",
        bubleeman: "Game designer 1",
    };

    command.addEventListener("keydown", function(event) {

        if (event.key === "Enter") {

            let input = command.value.toLowerCase();

            if (input === "help") {
                output.innerHTML += "<br>> help<br>Current commands: " 
                    + Object.keys(commands).join(", ") + 
                    ", help, clear";
            }
            else if (input === "clear") {
                output.innerHTML = "";
            }
            else if (commands[input]) {
                output.innerHTML += "<br>> " + input + "<br>";
                typeResponse(commands[input]);
            }
            else {
                output.innerHTML += "<br>> " + input + "<br>";
                 typeResponse("Unknown command.");
            }
            command.value = "";
        }
    });
    const text = "This is the websites terminal\nType help to see what you can do.";
    let i = 0;
    function typeText() {
        if (i < text.length) {
            output.innerHTML += text.charAt(i) === "\n" ? "<br>" : text.charAt(i);
            i++;
            setTimeout(typeText, 50);
        }
    }
    typeText();
    function typeResponse(text) {
    let i = 0;
    function type() {
        if (i < text.length) {
            if (text[i] === "<") {
                let end = text.indexOf(">", i);

                if (end !== -1) {
                    output.innerHTML += text.substring(i, end + 1);
                    i = end + 1;
                }
            }
            else if (text[i] === "\n") {
                output.innerHTML += "<br>";
                i++;
            }
            else {
                output.innerHTML += text[i];
                i++;
            }

            setTimeout(type, 50);
        }
    }

    type();
}
</script>
