<!DOCTYPE html>
<html>
<head>
    <title>CODERS VERSE
    </title>
    <link rel="icon" type="image/png" href="Pictures/Logo.png">
        <style>
            #command {
                width: 100%;
                box-sizing: border-box;
                background-color: #111;
                color: #00ff66;
                border: 1px solid #00ff66;
                font-family: monospace;
            }
            #terminal {
                background-color: black;
                color: #0f6;
                width: 30%;
                border-radius: 5px;
                height:200px;
                padding: 10px;
                font-family: monospace;
                font-size: 12px;
                border: 3px solid #0f6;

                position: absolute;
                top: 10px;
                right: 10px;

            }
            #output {
                min-height: 100px;
                margin-bottom: 10px;
            }

            body { 
                min-height:100vh;
                background: linear-gradient(to bottom, black, grey);
                background-attachment:fixed;
                border: 3px solid black;
                margin: 0;
            }
            h1 {
                font-family: Georgia, serif;
                font-size: 32px;
            }

            h2 {
                size: 22px;
            }

            p {
                font-size: 18px;
                color: white;
                font-family: monospace;
            }
        </style>
</head>
    <body>
        <h1><b>This is the start of the Coders verse.</b></h1>
        <h2>The purpose</h2>
        <p>Our goal is to Make a place where poeple can; learn, code, talk and feel glad<br>
            about who we are without the threats and disrespect we gain from groups of <br>
            people who overlook our use.</p>
            <br>
            <a href="Code/WeLearn%D0%A0%D1%83%D1%81%D1%81%D0%BA%D0%B8%D0%B9.html">Game design 1</a><img src="Pictures/Russian Flag.png" alt="Russian Flag" width="50" height="50" align="center">
            <div id="terminal">
                <div id="output"></div> 
                <input type="text" id="command" placeholder="Type command">
            </div>
        </body>
</html>
<script>
    const command = document.getElementById("command");
    const output = document.getElementById("output");

    const commands = {
        hello: "How goes you?",
        about: "We have fun help eachother learn.",
        games: "Sorry we dont have any games yet but we will soon.😢",
        Join: "Join our group by sending me a message on discord. My username is: sainwolf2703",
    };

    command.addEventListener("keydown", function(event) {

        if (event.key === "Enter") {

            let input = command.value.toLowerCase();

            if (input === "help") {
                output.innerHTML += "<br>> help<br>Current commands: " 
                    + Object.keys(commands).join(", ") 
                    + ", help, clear";
            }

            else if (input === "clear") {
                output.innerHTML = "";
            }

            else if (commands[input]) {
                output.innerHTML += "<br>> " + input + "<br>" 
                    + commands[input];
            }

            else {
                output.innerHTML += "<br>> " + input 
                    + "<br>Unknown command.";
            }

            command.value = "";
        }
    });
    const text = "This is the websites terminal\nType help to see what you can do.";
    let i = 0;

    function typeText() {
        if (i < text.length) {
            output.innerHTML += text.charAt(i) === "\n" ? "<br>" : text.charAt(i);
            i++;
            setTimeout(typeText, 50);
        }
    }
    typeText();
</script>
