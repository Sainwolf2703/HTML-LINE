<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Our Projects</title>
        <link rel="icon" type="image/png" href="Pictures/CV-logo-v2.png">
        <style>
            .button {
                display: inline-block;
                padding: 10px 20px;
                background-color: rgba(90, 62, 194, 0.568);
                color: #39d879;
                text-decoration: none;
                border: 2px solid #0f6;
                border-radius: 20px;
                font-family: monospace;
                font-size: clamp(15px, 1.5vw, 30px);
                transition: opacity 0.3s;
            }

            .button:hover {
                opacity: 0.5;
                transition: opacity 0.7s;
            }
            .navbar {
    			position: fixed;
				top: 0;
   				left: 0;
   				width: 100%;
    			background-color: #222;
    			display: flex;
    			justify-content: center;
    			gap: 40px;
    			padding: 15px 0;
    			z-index: 1000;
            }
            .fade{
                animation: 
                glow 2s infinite,
                fade 3s infinite;
            }
            @keyframes fade {
                0%, 40%{opacity: 1;}
                50%, 90%{opacity: 0;}
                100%{opacity: 1;}
            }
            @keyframes glow {
                0%, 40%{text-shadow:0 0 10px #ffffff;}
                50%, 90%{text-shadow: none}
                100%{text-shadow: 0 0 10px #ffffff;}
            }
            .W {animation-delay: 0.5s,0.8s;}
            .E {animation-delay: 0.7s,0.2s;}
            .L {animation-delay: 0.3s,0.6s;}
            .C {animation-delay: 0.9s,0.4s;}
            .O {animation-delay: 0.2s,0.9s;}
            .M {animation-delay: 0.8s,0.3s;}
            .body-1{
                font-size: clamp(15px, 1.5vw, 30px);
				color: #39d879;
                font-family: monospace;
                margin: 0;
                margin-left: 10px;
                margin-top: 70px;
            }
            .body-2{
                font-size: clamp(15px, 1.5vw, 30px);
				color: #39d879;
                font-family: monospace;
                margin: 0;
                margin-right:10px;
                text-align: right;
            }
            body { 
                background: linear-gradient(to bottom, black, rgba(17, 6, 58, 0.568));
                background-attachment:fixed;
                font-size: clamp(15px, 1.5vw, 30px);
				color: #39d879;
                font-family: monospace;
            }
            h1 {
                font-family: monospace;
                color: #5035a1;
                text-shadow: 0 0 10px rgba(138, 116, 211, 0.5);
                font-size: clamp(40px, 1.5vw, 50px);
            }
            h2 {
				font-family: monospace;
                font-size: clamp(27px, 1.5vw, 37px);
                color: #7d68bb;
                text-shadow: 0 0 10px rgba(120, 80, 255, 0.5);
            }
            h3 {
				font-family: monospace;
                font-size: clamp(22px, 1.5vw, 32px);
                color: #7a68b1;
                text-shadow: 0 0 10px rgba(120, 80, 255, 0.5);
            }
            p {
                font-family: arial;
                color:#01461d;
                font-size: clamp(18px, 1.5vw, 38px);
                text-align: justify;
                max-width: 700px;
            }
        </style>
    </head>
    <body>
        <div class="navbar">
            <a href="https://sainwolf2703.github.io/HTML-LINE/" class="button">Home</a>
            <a href="../Code/About-Page.html" class="button">About</a>
        </div>
        <div class="body-1">
                <span class="fade W ">W</span>
                <br>
                <span class="fade E ">E</span>
                <br>
                <span class="fade L">L</span>
                <br>
                <span class="fade C">C</span>
                <br>
                <span class="fade O">O</span>
                <br>
                <span class="fade M">M</span>
                <br>
                <span class="fade E">E</span>
                <br>
        </div>
    </body>
</html>
